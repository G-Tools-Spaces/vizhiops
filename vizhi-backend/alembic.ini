# Alembic configuration for vizhi-backend.
#
# The database URL is NOT set here: migrations/env.py reads DATABASE_URL from
# the environment / .env through app.config.settings, exactly as the server
# does, so there is one connection string to manage.
#
#   alembic upgrade head        apply every pending revision
#   alembic current             show the applied revision
#   alembic revision -m "..."   add a revision (write it by hand, see env.py)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
